    <script>
      (function() {
        // 0. Synchronize initial theme before DOM render to prevent flash
        try {
          var savedTheme = localStorage.getItem('devdesk_theme');
          if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}

        // 1. Ensure window.fetch is assignable for third-party extensions that hook fetch
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var proto = Object.getPrototypeOf(window) || window;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(proto, 'fetch');
          if (desc && (!desc.writable || !desc.set)) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() { return currentFetch; },
              set: function(fn) { currentFetch = fn; }
            });
          }
        } catch (e) {}

        // 2. Prevent unhandled third-party browser extension errors from bubbling
        function isExtensionNoise(err) {
          if (!err) return false;
          var text = (err.filename || '') + ' ' + (err.message || '') + ' ' + (err.stack || '') + ' ' + String(err);
          return (
            text.indexOf('chrome-extension://') !== -1 ||
            text.indexOf('moz-extension://') !== -1 ||
            text.indexOf('safari-extension://') !== -1 ||
            text.indexOf('Talisman extension') !== -1 ||
            text.indexOf('Cannot set property fetch of #<Window>') !== -1
          );
        }

        window.addEventListener('error', function(event) {
          if (isExtensionNoise(event) || isExtensionNoise(event.error)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isExtensionNoise(event.reason)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
