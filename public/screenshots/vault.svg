      <rect x="0" y="0" width="952" height="74" rx="12" fill="#0D1F17" stroke="#059669" stroke-opacity="0.4" stroke-width="1"/>
      
      <g transform="translate(20, 16)">
        <circle cx="21" cy="21" r="21" fill="#10B981" fill-opacity="0.15"/>
        <path d="M21 11 L29 15 V22 C29 27 21 31 21 31 C21 31 13 27 13 22 V15 Z" fill="#10B981"/>
        
        <text x="52" y="18" fill="#ECFDF5" font-size="14" font-weight="700" class="font-sans">Chiffrement Client-Side AES-GCM 256 bits Activé</text>
