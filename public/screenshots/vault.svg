      <g transform="translate(0, 188)">
        <rect x="0" y="0" width="952" height="82" rx="10" fill="#141417" stroke="#27272A" stroke-width="1"/>
        
        <g transform="translate(20, 16)">
          <rect x="0" y="0" width="48" height="48" rx="8" fill="#4F46E5" fill-opacity="0.2"/>
          <circle cx="24" cy="24" r="12" fill="#6366F1"/>
          
          <text x="64" y="20" fill="#FFFFFF" font-size="15" font-weight="600" class="font-sans">Google Gemini Flash / Pro Key</text>
          
