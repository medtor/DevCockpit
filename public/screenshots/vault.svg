<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad-v" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>
    <linearGradient id="primary-glow-v" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow-window-v" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  </style>

  <!-- Background Canvas -->
  <rect width="1280" height="720" fill="url(#bg-grad-v)" />

  <!-- Outer Window Frame -->
  <g filter="url(#shadow-window-v)">
    <rect x="20" y="16" width="1240" height="688" rx="14" fill="#09090B" stroke="#27272A" stroke-width="1"/>

    <!-- Window Top Header Bar -->
    <rect x="20" y="16" width="1240" height="42" rx="14" fill="#121215"/>
    <rect x="20" y="44" width="1240" height="14" fill="#121215"/>
    <line x1="20" y1="58" x2="1260" y2="58" stroke="#27272A" stroke-width="1"/>

    <!-- Window Controls -->
    <circle cx="44" cy="37" r="6" fill="#EF4444" opacity="0.9"/>
    <circle cx="64" cy="37" r="6" fill="#F59E0B" opacity="0.9"/>
    <circle cx="84" cy="37" r="6" fill="#10B981" opacity="0.9"/>

    <text x="640" y="41" fill="#71717A" font-size="12" font-weight="500" text-anchor="middle" class="font-sans">DevCockpit — Coffre-fort de Secrets &amp; Clés d'API (AES-GCM 256-bit)</text>
  </g>

  <!-- ==================== LEFT SIDEBAR ==================== -->
  <g id="sidebar-v">
    <rect x="20" y="58" width="240" height="646" fill="#0F0F12" stroke="#27272A" stroke-width="1"/>
    
    <!-- Brand / Logo -->
    <g transform="translate(40, 80)">
      <rect x="0" y="0" width="34" height="34" rx="8" fill="url(#primary-glow-v)"/>
      <path d="M17 7 L21 13 L27 15 L22 19 L23 25 L17 22 L11 25 L12 19 L7 15 L13 13 Z" fill="#FFFFFF" transform="scale(0.8) translate(4.5, 4.5)"/>
      <text x="44" y="22" fill="#FFFFFF" font-size="16" font-weight="700" class="font-sans">DevCockpit</text>
      <rect x="142" y="10" width="42" height="16" rx="4" fill="#4F46E5" fill-opacity="0.2" stroke="#6366F1" stroke-width="0.8"/>
      <text x="163" y="21.5" fill="#A5B4FC" font-size="9" font-weight="700" text-anchor="middle" class="font-sans">LOCAL</text>
    </g>

    <!-- Navigation Section -->
    <text x="40" y="145" fill="#52525B" font-size="10" font-weight="700" letter-spacing="0.08em" class="font-sans">PRINCIPAL</text>

    <!-- Nav Item: Dashboard -->
    <g transform="translate(32, 156)">
      <text x="48" y="22" fill="#A1A1AA" font-size="13" font-weight="500" class="font-sans">Tableau de Bord</text>
    </g>

    <g transform="translate(32, 196)">
      <text x="48" y="22" fill="#A1A1AA" font-size="13" font-weight="500" class="font-sans">Clés d'API &amp; Cloud</text>
    </g>

    <!-- Active Item: Coffre-fort Secrets -->
    <g transform="translate(32, 236)">
      <rect x="0" y="0" width="216" height="36" rx="8" fill="#1E1B4B" stroke="#4F46E5" stroke-opacity="0.4" stroke-width="1"/>
      <rect x="2" y="8" width="4" height="20" rx="2" fill="#6366F1"/>
      <path d="M22 16 L28 13 V18 C28 22 22 25 22 25 C22 25 16 22 16 18 V13 Z" fill="#818CF8"/>
      <text x="48" y="23" fill="#FFFFFF" font-size="13" font-weight="600" class="font-sans">Coffre-fort Secrets</text>
      <circle cx="195" cy="18" r="4" fill="#10B981"/>
    </g>

    <g transform="translate(32, 276)">
      <text x="48" y="22" fill="#A1A1AA" font-size="13" font-weight="500" class="font-sans">Studio Prompts</text>
    </g>

    <g transform="translate(32, 316)">
      <text x="48" y="22" fill="#A1A1AA" font-size="13" font-weight="500" class="font-sans">Serveurs MCP</text>
    </g>

    <text x="40" y="375" fill="#52525B" font-size="10" font-weight="700" letter-spacing="0.08em" class="font-sans">BOÎTE À OUTILS HORS-LIGNE</text>

    <g transform="translate(32, 386)">
      <text x="48" y="22" fill="#A1A1AA" font-size="13" font-weight="500" class="font-sans">Outils Développeur</text>
    </g>
  </g>

  <!-- ==================== TOP BAR ==================== -->
  <g id="topbar-v">
