            <text x="50" y="21" fill="#34D399" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">✓ Valide (65ms)</text>

            <rect x="110" y="0" width="36" height="34" rx="6" fill="#18181B" stroke="#3F3F46" stroke-width="0.8"/>
            <circle cx="128" cy="17" r="4" stroke="#A1A1AA" stroke-width="1.5" fill="none"/>

            <rect x="156" y="0" width="80" height="34" rx="6" fill="#4F46E5"/>
            <text x="196" y="21" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">Copier</text>
          </g>
        </g>
      </g>

