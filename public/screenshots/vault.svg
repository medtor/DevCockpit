      <text x="185" y="20.5" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">+ Ajouter Secret</text>
    </g>
  </g>

  <!-- ==================== MAIN CONTENT: VAULT VIEW ==================== -->
  <g id="main-content-v" transform="translate(284, 130)">
    
    <!-- Security Banner Card -->
