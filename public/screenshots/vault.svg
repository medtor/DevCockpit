          <text x="362" y="21" fill="#FDE68A" font-size="10" font-weight="600" text-anchor="middle" class="font-sans">STAGING</text>
          
          <text x="64" y="42" fill="#71717A" font-size="13" class="font-mono">sk-ant-••••••••••••••••••••••••••••••••k21a</text>
          
