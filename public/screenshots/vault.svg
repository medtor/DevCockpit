      <!-- Secret Card 4: GitHub Personal Access Token -->
      <g transform="translate(0, 282)">
        <rect x="0" y="0" width="952" height="82" rx="10" fill="#141417" stroke="#27272A" stroke-width="1"/>
        
        <g transform="translate(20, 16)">
          <rect x="0" y="0" width="48" height="48" rx="8" fill="#3F3F46" fill-opacity="0.5"/>
          <circle cx="24" cy="24" r="12" fill="#71717A"/>
          
          <text x="64" y="20" fill="#FFFFFF" font-size="15" font-weight="600" class="font-sans">GitHub Personal Access Token (CI/CD)</text>
          
          <rect x="380" y="7" width="84" height="20" rx="4" fill="#059669" fill-opacity="0.2" stroke="#10B981" stroke-width="0.8"/>
          <text x="422" y="21" fill="#A7F3D0" font-size="10" font-weight="600" text-anchor="middle" class="font-sans">SCOPES: REPO</text>
          
          <text x="64" y="42" fill="#71717A" font-size="13" class="font-mono">ghp_••••••••••••••••••••••••••••••••dvRj</text>
          
