<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad-tb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>
    <linearGradient id="primary-glow-tb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="toast-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow-window-tb" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="toast-shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  </style>

  <!-- Background Canvas -->
  <rect width="1280" height="720" fill="url(#bg-grad-tb)" />

  <!-- Outer Window Frame -->
  <g filter="url(#shadow-window-tb)">
    <rect x="20" y="16" width="1240" height="688" rx="14" fill="#09090B" stroke="#27272A" stroke-width="1"/>

    <!-- Window Top Header Bar -->
    <rect x="20" y="16" width="1240" height="42" rx="14" fill="#121215"/>
    <rect x="20" y="44" width="1240" height="14" fill="#121215"/>
    <line x1="20" y1="58" x2="1260" y2="58" stroke="#27272A" stroke-width="1"/>

    <!-- Window Controls -->
    <circle cx="44" cy="37" r="6" fill="#EF4444" opacity="0.9"/>
    <circle cx="64" cy="37" r="6" fill="#F59E0B" opacity="0.9"/>
    <circle cx="84" cy="37" r="6" fill="#10B981" opacity="0.9"/>

    <text x="640" y="41" fill="#71717A" font-size="12" font-weight="500" text-anchor="middle" class="font-sans">DevCockpit — Boîte à Outils Développeur &amp; Convertisseurs Hors-Ligne</text>
  </g>

  <!-- ==================== LEFT SIDEBAR ==================== -->
  <g id="sidebar-tb">
    <rect x="20" y="58" width="240" height="646" fill="#0F0F12" stroke="#27272A" stroke-width="1"/>
    
    <!-- Brand / Logo -->
    <g transform="translate(40, 80)">
      <rect x="0" y="0" width="34" height="34" rx="8" fill="url(#primary-glow-tb)"/>
      <path d="M17 7 L21 13 L27 15 L22 19 L23 25 L17 22 L11 25 L12 19 L7 15 L13 13 Z" fill="#FFFFFF" transform="scale(0.8) translate(4.5, 4.5)"/>
      <text x="44" y="22" fill="#FFFFFF" font-size="16" font-weight="700" class="font-sans">DevCockpit</text>
      <rect x="142" y="10" width="42" height="16" rx="4" fill="#4F46E5" fill-opacity="0.2" stroke="#6366F1" stroke-width="0.8"/>
      <text x="163" y="21.5" fill="#A5B4FC" font-size="9" font-weight="700" text-anchor="middle" class="font-sans">LOCAL</text>
    </g>

    <!-- Navigation Section -->
    <text x="40" y="145" fill="#52525B" font-size="10" font-weight="700" letter-spacing="0.08em" class="font-sans">PRINCIPAL</text>

    <!-- Nav Item: Dashboard -->
    <g transform="translate(32, 156)">
      <text x="48" y="22" fill="#A1A1AA" font-size="13" font-weight="500" class="font-sans">Tableau de Bord</text>
    </g>

    <g transform="translate(32, 196)">
      <text x="48" y="22" fill="#A1A1AA" font-size="13" font-weight="500" class="font-sans">Clés d'API &amp; Cloud</text>
    </g>

    <g transform="translate(32, 236)">
      <text x="48" y="22" fill="#A1A1AA" font-size="13" font-weight="500" class="font-sans">Coffre-fort Secrets</text>
    </g>

    <g transform="translate(32, 276)">
      <text x="48" y="22" fill="#A1A1AA" font-size="13" font-weight="500" class="font-sans">Studio Prompts</text>
    </g>

    <g transform="translate(32, 316)">
      <text x="48" y="22" fill="#A1A1AA" font-size="13" font-weight="500" class="font-sans">Serveurs MCP</text>
    </g>

    <!-- Navigation Section: OUTILS ACTIVE -->
    <text x="40" y="375" fill="#52525B" font-size="10" font-weight="700" letter-spacing="0.08em" class="font-sans">BOÎTE À OUTILS HORS-LIGNE</text>

    <!-- Active Item: Outils Développeur -->
    <g transform="translate(32, 386)">
      <rect x="0" y="0" width="216" height="36" rx="8" fill="#1E1B4B" stroke="#4F46E5" stroke-opacity="0.4" stroke-width="1"/>
      <rect x="2" y="8" width="4" height="20" rx="2" fill="#6366F1"/>
      <text x="48" y="23" fill="#FFFFFF" font-size="13" font-weight="600" class="font-sans">Outils Développeur</text>
    </g>

    <!-- Sub-items List with Active Tool highlighted -->
    <g transform="translate(48, 432)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="180" height="28" rx="6" fill="#27272A" stroke="#3F3F46" stroke-width="0.8"/>
        <circle cx="14" cy="14" r="3" fill="#6366F1"/>
        <text x="26" y="18" fill="#FFFFFF" font-size="12" font-weight="600" class="font-sans">JSON &amp; TypeScript</text>
      </g>
      
      <g transform="translate(0, 32)">
        <circle cx="14" cy="14" r="3" fill="#52525B"/>
        <text x="26" y="18" fill="#A1A1AA" font-size="12" class="font-sans">QR Generator</text>
      </g>

      <g transform="translate(0, 64)">
        <circle cx="14" cy="14" r="3" fill="#52525B"/>
        <text x="26" y="18" fill="#A1A1AA" font-size="12" class="font-sans">Base64 &amp; URL &amp; Hex</text>
      </g>

      <g transform="translate(0, 96)">
        <circle cx="14" cy="14" r="3" fill="#52525B"/>
        <text x="26" y="18" fill="#A1A1AA" font-size="12" class="font-sans">UUID &amp; NanoID</text>
      </g>

      <g transform="translate(0, 128)">
        <circle cx="14" cy="14" r="3" fill="#52525B"/>
        <text x="26" y="18" fill="#A1A1AA" font-size="12" class="font-sans">Hash (SHA, MD5)</text>
      </g>

      <g transform="translate(0, 160)">
        <circle cx="14" cy="14" r="3" fill="#52525B"/>
        <text x="26" y="18" fill="#A1A1AA" font-size="12" class="font-sans">Testeur Regex</text>
      </g>

      <g transform="translate(0, 192)">
        <circle cx="14" cy="14" r="3" fill="#52525B"/>
        <text x="26" y="18" fill="#A1A1AA" font-size="12" class="font-sans">Couleurs &amp; CSS</text>
      </g>
    </g>
  </g>

  <!-- ==================== TOP BAR ==================== -->
  <g id="topbar-tb">
    <rect x="260" y="58" width="1000" height="56" fill="#09090B" stroke="#27272A" stroke-width="1"/>
    
    <g transform="translate(284, 70)">
      <text x="0" y="24" fill="#FFFFFF" font-size="16" font-weight="700" class="font-sans">Boîte à Outils Développeur</text>
      <text x="210" y="24" fill="#71717A" font-size="12" class="font-sans">• 9 utilitaires natifs 100% hors-ligne</text>
    </g>

    <!-- Topbar Actions -->
    <g transform="translate(1100, 70)">
      <rect x="0" y="0" width="130" height="32" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1"/>
      <circle cx="16" cy="16" r="4" fill="#10B981"/>
      <text x="28" y="20" fill="#E4E4E7" font-size="11" font-weight="500" class="font-sans">Zéro Fuite Réseau</text>
    </g>
  </g>

  <!-- ==================== MAIN CONTENT: TOOLBOX VIEW ==================== -->
  <g id="main-content-tb" transform="translate(284, 130)">
    
    <!-- Search Bar with instant filter -->
    <g id="search-filter-bar">
      <rect x="0" y="0" width="952" height="44" rx="10" fill="#141417" stroke="#2E2E35" stroke-width="1"/>
      <circle cx="24" cy="22" r="6" stroke="#818CF8" stroke-width="1.8" fill="none"/>
      <line x1="28.5" y1="26.5" x2="33" y2="31" stroke="#818CF8" stroke-width="1.8"/>
      <text x="44" y="26" fill="#F4F4F5" font-size="13" class="font-sans">json</text>
      <line x1="72" y1="14" x2="72" y2="30" stroke="#6366F1" stroke-width="2"/>
      
      <!-- Pill indicator matching tools -->
      <rect x="810" y="9" width="128" height="26" rx="6" fill="#27272A"/>
      <text x="874" y="25" fill="#A1A1AA" font-size="11" font-weight="500" text-anchor="middle" class="font-sans">1 outil correspondant</text>
    </g>

    <!-- Horizontal Sub-tools Pills -->
    <g id="tool-pills" transform="translate(0, 56)">
      <!-- Active Pill: JSON & TypeScript -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="160" height="34" rx="8" fill="#4F46E5" fill-opacity="0.2" stroke="#6366F1" stroke-width="1.2"/>
        <text x="14" y="21" fill="#C7D2FE" font-size="12" font-weight="600" class="font-sans">{ } JSON &amp; TypeScript</text>
      </g>

      <!-- Pill: Base64 & URL -->
      <g transform="translate(170, 0)">
        <rect x="0" y="0" width="140" height="34" rx="8" fill="#141417" stroke="#27272A" stroke-width="1"/>
        <text x="14" y="21" fill="#A1A1AA" font-size="12" font-weight="500" class="font-sans">Base64 &amp; URL</text>
      </g>

      <!-- Pill: UUID & ID -->
      <g transform="translate(320, 0)">
        <rect x="0" y="0" width="130" height="34" rx="8" fill="#141417" stroke="#27272A" stroke-width="1"/>
        <text x="14" y="21" fill="#A1A1AA" font-size="12" font-weight="500" class="font-sans">UUID &amp; NanoID</text>
      </g>

      <!-- Pill: Hash Generator -->
      <g transform="translate(460, 0)">
        <rect x="0" y="0" width="140" height="34" rx="8" fill="#141417" stroke="#27272A" stroke-width="1"/>
        <text x="14" y="21" fill="#A1A1AA" font-size="12" font-weight="500" class="font-sans">Générateur Hash</text>
      </g>

      <!-- Pill: Regex Tester -->
      <g transform="translate(610, 0)">
        <rect x="0" y="0" width="130" height="34" rx="8" fill="#141417" stroke="#27272A" stroke-width="1"/>
        <text x="14" y="21" fill="#A1A1AA" font-size="12" font-weight="500" class="font-sans">Testeur Regex</text>
      </g>

      <!-- Pill: QR Generator -->
      <g transform="translate(750, 0)">
        <rect x="0" y="0" width="130" height="34" rx="8" fill="#141417" stroke="#27272A" stroke-width="1"/>
        <text x="14" y="21" fill="#A1A1AA" font-size="12" font-weight="500" class="font-sans">Générateur QR</text>
      </g>
    </g>

    <!-- Tool Workstation: Dual-Pane JSON Editor & Formatter -->
    <g id="json-workstation" transform="translate(0, 104)">
      
      <!-- Top Action Toolbar -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="952" height="42" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1"/>
        
        <!-- Prettify Button -->
        <rect x="10" y="7" width="100" height="28" rx="6" fill="#4F46E5"/>
        <text x="60" y="25" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">⚡ Formater (2)</text>

        <!-- Minify Button -->
        <rect x="118" y="7" width="85" height="28" rx="6" fill="#27272A" stroke="#3F3F46" stroke-width="0.8"/>
        <text x="160" y="25" fill="#D4D4D8" font-size="11" font-weight="500" text-anchor="middle" class="font-sans">Minifier</text>

        <!-- Generate TypeScript Button -->
        <rect x="211" y="7" width="155" height="28" rx="6" fill="#27272A" stroke="#3F3F46" stroke-width="0.8"/>
        <text x="288" y="25" fill="#D4D4D8" font-size="11" font-weight="500" text-anchor="middle" class="font-sans">Types TypeScript (TS)</text>

        <!-- Status Validation Badge -->
        <rect x="740" y="9" width="95" height="24" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.3" stroke-width="0.8"/>
        <text x="787" y="24" fill="#34D399" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">✓ JSON Valide</text>

        <!-- Clear Button -->
        <rect x="845" y="7" width="95" height="28" rx="6" fill="#27272A" stroke="#3F3F46" stroke-width="0.8"/>
        <text x="892" y="25" fill="#A1A1AA" font-size="11" font-weight="500" text-anchor="middle" class="font-sans">Effacer</text>
      </g>

      <!-- Dual Pane Container -->
      <g transform="translate(0, 50)">
        
        <!-- Left Pane: RAW INPUT -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="466" height="380" rx="10" fill="#101014" stroke="#27272A" stroke-width="1"/>
          <rect x="0" y="0" width="466" height="34" rx="10" fill="#141419"/>
          <line x1="0" y1="34" x2="466" y2="34" stroke="#27272A" stroke-width="1"/>
          
          <text x="14" y="22" fill="#A1A1AA" font-size="11" font-weight="600" class="font-sans">ENTRÉE BRUTE</text>
          <text x="400" y="22" fill="#52525B" font-size="10" class="font-mono">148 B</text>

          <!-- Input Code Content -->
          <g transform="translate(16, 52)" class="font-mono" font-size="11" fill="#71717A">
            <text x="0" y="0" fill="#A1A1AA">{"app":"DevCockpit","status":"active","stats":{"keys":6,"tools":9},"features":["vault","mcp","prompts"],"offline":true}</text>
          </g>
        </g>

        <!-- Right Pane: FORMATTED OUTPUT (with Syntax Highlighting & Copy Button) -->
        <g transform="translate(486, 0)">
          <rect x="0" y="0" width="466" height="380" rx="10" fill="#0D1117" stroke="#27272A" stroke-width="1"/>
          <rect x="0" y="0" width="466" height="34" rx="10" fill="#141419"/>
          <line x1="0" y1="34" x2="466" y2="34" stroke="#27272A" stroke-width="1"/>
          
          <text x="14" y="22" fill="#38BDF8" font-size="11" font-weight="600" class="font-sans">SORTIE FORMATEE &amp; COLORÉE</text>
          
          <!-- Copy to Clipboard Button (with Animated Green Checkmark Toast) -->
          <rect x="330" y="5" width="124" height="24" rx="6" fill="#059669" fill-opacity="0.25" stroke="#10B981" stroke-width="1"/>
          <path d="M344 17 L348 21 L356 12" stroke="#34D399" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="396" y="21" fill="#34D399" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">Copié !</text>

          <!-- Formatted Code Lines -->
          <g transform="translate(16, 54)" class="font-mono" font-size="12">
            <!-- Line numbers -->
            <g fill="#4B5563">
              <text x="0" y="0">1</text>
              <text x="0" y="22">2</text>
              <text x="0" y="44">3</text>
              <text x="0" y="66">4</text>
              <text x="0" y="88">5</text>
              <text x="0" y="110">6</text>
              <text x="0" y="132">7</text>
              <text x="0" y="154">8</text>
              <text x="0" y="176">9</text>
              <text x="0" y="198">10</text>
              <text x="0" y="220">11</text>
              <text x="0" y="242">12</text>
              <text x="0" y="264">13</text>
            </g>

            <!-- Code with syntax color tokens -->
            <g transform="translate(28, 0)">
              <text x="0" y="0" fill="#E4E4E7">{</text>
              
              <text x="16" y="22"><tspan fill="#7DD3FC">"app"</tspan><tspan fill="#E4E4E7">: </tspan><tspan fill="#A7F3D0">"DevCockpit"</tspan><tspan fill="#E4E4E7">,</tspan></text>
              
              <text x="16" y="44"><tspan fill="#7DD3FC">"status"</tspan><tspan fill="#E4E4E7">: </tspan><tspan fill="#A7F3D0">"active"</tspan><tspan fill="#E4E4E7">,</tspan></text>
              
              <text x="16" y="66"><tspan fill="#7DD3FC">"stats"</tspan><tspan fill="#E4E4E7">: {</tspan></text>
              
              <text x="32" y="88"><tspan fill="#7DD3FC">"keys"</tspan><tspan fill="#E4E4E7">: </tspan><tspan fill="#FDE047">6</tspan><tspan fill="#E4E4E7">,</tspan></text>
              
              <text x="32" y="110"><tspan fill="#7DD3FC">"tools"</tspan><tspan fill="#E4E4E7">: </tspan><tspan fill="#FDE047">9</tspan></text>
              
              <text x="16" y="132" fill="#E4E4E7">},</text>
              
              <text x="16" y="154"><tspan fill="#7DD3FC">"features"</tspan><tspan fill="#E4E4E7">: [</tspan></text>
              
              <text x="32" y="176" fill="#A7F3D0">"vault"<tspan fill="#E4E4E7">, </tspan>"mcp"<tspan fill="#E4E4E7">, </tspan>"prompts"</text>
              
              <text x="16" y="198" fill="#E4E4E7">],</text>
              
              <text x="16" y="220"><tspan fill="#7DD3FC">"offline"</tspan><tspan fill="#E4E4E7">: </tspan><tspan fill="#F472B6">true</tspan></text>
              
              <text x="0" y="242" fill="#E4E4E7">}</text>
            </g>
          </g>

          <!-- Floating Notification Toast bottom-right -->
          <g transform="translate(180, 310)" filter="url(#toast-shadow)">
            <rect x="0" y="0" width="260" height="46" rx="8" fill="url(#toast-grad)" stroke="#10B981" stroke-width="1.2"/>
            <circle cx="24" cy="23" r="10" fill="#10B981"/>
            <path d="M19 23 L23 27 L30 18" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
            <text x="44" y="21" fill="#FFFFFF" font-size="11" font-weight="600" class="font-sans">Résultat copié !</text>
            <text x="44" y="34" fill="#6EE7B7" font-size="10" class="font-sans">Placé dans votre presse-papier</text>
          </g>

        </g>
      </g>
    </g>

  </g>
</svg>
